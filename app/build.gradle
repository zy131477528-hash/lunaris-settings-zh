// Lunaris Settings ZH - LSPosed module
// enable in LSPosed with scope: com.android.settings

apply plugin: 'com.android.application'

android {
    namespace 'com.mike.lunaris.zhcn'
    compileSdk 35

    defaultConfig {
        applicationId "com.mike.lunaris.zhcn"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
